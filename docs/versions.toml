# Campaign app version baseline, accepted 2026-10-17.
# Gradle version catalog imported by backend/settings.gradle.kts.
# Application version reference; Gradle imports this catalog directly.
# Frontend versions must also be reflected in package.json and its lockfile;
# npm does not consume this catalog directly.
# Use Boot-managed transitive versions unless an override is documented below.

[versions]
java = "25" # Latest LTS; vendor patch/build still to be pinned.
gradle = "9.7.0" # Conservative Kotlin-supported baseline; latest is 9.8.1.
kotlin = "2.4.21" # Align compiler plugins, stdlib, and reflect; overrides Boot.
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
arrow = "2.2.3"
postgresql = "18.6" # Same version for Compose and Testcontainers; digest pinned in compose.yaml.
kotest = "6.2.5"
testcontainers = "2.0.5" # Also managed by Boot 4.1.1.
archunit = "1.5.1"
springdoc = "3.1.1" # Jackson dependency alignment check remains required.
openapi-generator = "7.26.0"
angular = "22.2.3"
angular-cli = "22.2.3"
angular-material = "22.2.2" # Applies to Material and CDK.
typescript = "6.0.3" # Angular requires >=6.0 <6.1; excludes TypeScript 7.
node = "26.12.0"
vitest = "5.0.5"
playwright = "1.64.1"
flyway = "13.10.3" # Aligned override; setup startup/migration checks passed. Boot uses 12.4.0.

commonmark = "0.30.0"
snakeyaml-engine = "3.1.1" # Increment 3A: restricted YAML 1.2 front matter.
twelvemonkeys = "3.15.3" # Increment 6A: pure-Java WebP decoding.

[libraries]
imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
openapi-generator = { module = "org.openapitools:openapi-generator-cli", version.ref = "openapi-generator" }
commonmark-core = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
