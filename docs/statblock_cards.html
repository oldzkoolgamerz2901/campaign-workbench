<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Sisters — Statblock Cards</title>
<style>
/* ============================================================
   LOST SISTERS — STATBLOCK CARDS
   Design ported from Rules&Instructions/Statblock designs/*.png
   Card proportion 243 x 420 (1 : 1.728). Print size: tarot 70 x 120 mm.
   ------------------------------------------------------------
   Everything inside a card is sized in `em` against the card's
   own font-size, which is derived from the card width. So one
   variable (--card-w) rescales the entire design, on screen and
   on paper, with no other change.
   ============================================================ */

:root{
  --card-w: 300px;          /* screen size; the slider writes this */
  --card-print-w: 70mm;     /* tarot. 63mm = poker, 89mm = bridge-tall */

  /* --------------------------------------------------------
     COLOR TOKENS — card content only (front + back panels),
     same scope as the type tokens below. The design system's
     palette, verbatim, plus its own semantic aliases:
       Font_Header_Color → Brand-red
       Font_Body_Color   → Gray800
       Font_Secondary    → Gray700
     -------------------------------------------------------- */
  --color-brand-red:      #420000;
  --color-paper-yellow:   #F2EFDD;
  --color-contrast-brown: #766A56;
  --color-gray-800:       #161616;
  --color-gray-700:       #505050;
  --color-gray-500:       #999999;
  --color-gray-300:       #D6D6D6;
  --color-gray-100:       #F4F4F4;

  --font-header-color: var(--color-brand-red);
  --font-body-color:   var(--color-gray-800);
  --font-secondary:    var(--color-gray-700);

  /* card roles, built only from the tokens above */
  --parchment:   var(--color-paper-yellow);
  /* tinted ability rows: Contrast-brown mixed into the parchment,
     not a separately invented hex, so the banding is still made of
     only the given colors */
  --parchment-2: color-mix(in srgb, var(--color-contrast-brown) 10%, var(--color-paper-yellow));
  --parchment-3: color-mix(in srgb, var(--color-contrast-brown) 20%, var(--color-paper-yellow));
  --ink:    var(--font-body-color);
  --muted:  var(--font-secondary);
  --accent: var(--font-header-color);   /* ability labels, section rules */
  --rule:   var(--color-gray-500);
  --edge:   var(--color-gray-800);

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:  "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;

  /* --------------------------------------------------------
     TYPE TOKENS — card content only (front + back panels).
     Five styles, nothing else. Each size is a unitless multiple
     of the card's own base font-size (--card-w / 24, ~10px at
     the 243px reference width the source design was built at),
     so H1's "10px" and the rest hold that exact ratio to it at
     any card size and survive auto-fit's shrinking untouched.
     -------------------------------------------------------- */
  --card-font: "Inter", "Segoe UI", Arial, sans-serif;

  --fs-h1: 1;      --fw-h1: 700;   /* H1 — Inter Bold   10px — ALL CAPS */
  --fs-h2: .8;     --fw-h2: 400;   /* H2 — Inter Reg     8px — ALL CAPS */
  --fs-h3: .9;     --fw-h3: 700;   /* H3 — Inter Bold    9px            */
  --fs-p:  .8;     --fw-p:  400;   /* P  — Inter Reg     8px            */
  --fs-pb: .8;     --fw-pb: 700;   /* P bold — Inter Bold 8px           */
}

/* Inter, bundled locally (SIL OFL) so the card works fully offline —
   this file is meant to be opened by double-click, not served. One
   variable-font file per Unicode range covers every weight 100–900,
   so both the 400 and 700 the tokens above use come from one file. */
@font-face{
  font-family:"Inter";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("../../Downloads/lost_sisters_cards/Cards/fonts/inter-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,
    U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Inter";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("../../Downloads/lost_sisters_cards/Cards/fonts/inter-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
    U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,
    U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}

*{ box-sizing: border-box; }

html{ background:#1a1714; }
body{
  margin:0; padding: 28px 24px 80px;
  font-family: var(--sans);
  color:#e8e2d6;
  background:
    radial-gradient(1200px 700px at 50% -200px, #2e2822 0%, #1a1714 70%);
  min-height:100vh;
}

/* ---------- control bar (screen only) ---------- */
.bar{
  position: sticky; top:0; z-index:50;
  display:flex; flex-wrap:wrap; gap:18px; align-items:center;
  margin:-28px -24px 26px; padding:12px 24px 0;
  background:rgba(20,17,14,.92);
  backdrop-filter: blur(8px);
  border-bottom:1px solid #3a332b;
  font-size:13px;
}
.bar h1{
  font-family:var(--serif); font-size:16px; font-weight:600;
  margin:0 6px 0 0; letter-spacing:.02em; color:#d8cfbd;
}
.bar label{ display:flex; align-items:center; gap:7px; color:#a79d8c; white-space:nowrap; cursor:pointer; }
.bar input[type=range]{ width:150px; accent-color:#a8563f; }
.bar input[type=checkbox]{ accent-color:#a8563f; }
.bar input[type=search],
.bar select{
  background:#241f1a; border:1px solid #453d33; color:#e8e2d6;
  border-radius:5px; padding:5px 9px; font:inherit;
}
.bar input[type=search]{ width:190px; }
.bar button{
  background:#7d2b28; color:#f3ece0; border:0; border-radius:5px;
  padding:6px 14px; font:inherit; cursor:pointer;
}
.bar button:hover{ background:#96352f; }
.bar button:disabled{ opacity:.45; cursor:default; }
.bar button:disabled:hover{ background:#7d2b28; }
.bar button.quiet{ background:none; border:1px solid #453d33; color:#a79d8c; padding:5px 13px; }
.bar button.quiet:hover{ background:none; color:#e8e2d6; border-color:#6f6659; }
.bar .spacer{ flex:1 1 auto; }
.bar .count{ color:#6f6659; }
/* selection count on the Print button */
.bar .badge{
  display:inline-block; min-width:1.6em; margin-left:8px; padding:0 .45em;
  border-radius:999px; background:#f3ece0; color:#7d2b28;
  font-size:11px; font-weight:700; line-height:1.6; text-align:center;
}
.bar .badge[hidden]{ display:none; }

/* the card browser and the print selection share one page: the body
   class picks which of the bar's controls belong to the current screen */
body:not(.selection-view) .selection-only,
body.selection-view .cards-only{ display:none !important; }

/* ---------- tabs: the bar's second row, sitting on its bottom border ---------- */
.tabs{ flex:1 0 100%; display:flex; gap:4px; }
.bar .tabs button{
  background:none; border:0; border-radius:0;
  border-bottom:2px solid transparent; margin-bottom:-1px;
  color:#a79d8c; padding:7px 12px 9px;
  font-family:var(--serif); font-size:15px; letter-spacing:.02em;
}
.bar .tabs button:hover{ background:none; color:#e8e2d6; }
.bar .tabs button[aria-selected="true"]{ color:#e8e2d6; border-bottom-color:#a8563f; }
.tabs .n{ font-family:var(--sans); font-size:12px; color:#6f6659; margin-left:6px; }
/* the selection screen has no tabs, just its own title in their place */
.tabs .tab-title{
  color:#e8e2d6; padding:7px 12px 9px; margin-bottom:-1px;
  border-bottom:2px solid #a8563f;
  font-family:var(--serif); font-size:15px; letter-spacing:.02em;
}

/* ---------- page layout ---------- */
.sheet{ display:flex; flex-direction:column; gap:38px; }

/* ---------- groups: headed sections within a tab ---------- */
.group-head{
  font-family:var(--serif); font-size:17px; font-weight:600; color:#d8cfbd;
  letter-spacing:.02em;
  margin:0 0 16px; padding-bottom:7px;
  border-bottom:1px solid #3a332b;
}
.group-head .n{ font-family:var(--sans); font-size:12px; font-weight:400; color:#6f6659; margin-left:8px; }
.group-empty{ color:#6f6659; font-family:var(--serif); font-size:14px; margin:0 2px; }
.group:not(.none) .group-empty{ display:none; }
.group-cards{
  display:grid;
  grid-template-columns:repeat(auto-fill, var(--card-w));
  gap:26px 18px;
}

.item[hidden]{ display:none; }
/* other tabs' groups */
.group.offtab{ display:none; }

/* the row above a card: its name, and on the selection screen its copies */
.item-head{
  display:flex; align-items:center; gap:8px;
  width:var(--card-w); margin:0 0 8px 2px;
}
.item-label{
  flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-family:var(--serif); font-size:14px; color:#9b9081;
  letter-spacing:.03em;
}
.item-label span{ color:#6b6254; font-size:12px; font-family:var(--sans); }

/* ---------- copies to print: − n +, selection screen only ---------- */
.copies{ display:none; flex:none; align-items:center; gap:2px; }
body.selection-view .copies{ display:flex; }
.copies button{
  width:22px; height:22px; padding:0;
  background:#241f1a; border:1px solid #453d33; border-radius:5px;
  color:#e8e2d6; font:600 14px/1 var(--sans); cursor:pointer;
}
.copies button:hover{ border-color:#a8563f; }
.copies button:disabled{ opacity:.35; cursor:default; border-color:#453d33; }
.copies input{
  width:30px; height:22px; padding:0;
  background:none; border:0; color:#e8e2d6;
  font:600 13px var(--sans); text-align:center;
  appearance:textfield; -moz-appearance:textfield;
}
.copies input::-webkit-inner-spin-button,
.copies input::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
.copies :focus-visible{ outline:2px solid #a8563f; outline-offset:1px; }

.empty{ color:#6f6659; font-family:var(--serif); font-size:15px; margin:10px 2px; }

/* ---------- select-for-print button: on hover, or always once selected ---------- */
.card-slot{ position:relative; }
.pick{
  position:absolute; top:10px; right:10px; z-index:2;
  width:34px; height:34px; padding:0;
  display:grid; place-items:center;
  border-radius:6px;
  background:rgba(20,17,14,.85);
  border:1px solid #a8563f; cursor:pointer;
  opacity:0; transition:opacity .15s;
}
/* the icon file is drawn in black. Red lines by default, through the
   #icon-red filter at the top of <body> (a CSS mask would be the usual
   way, but browsers block masks from file:// pages); white once hovered
   or selected, on the red button. */
.pick img{ width:26px; height:26px; filter:url(#icon-red); pointer-events:none; }
.pick:hover img,
.item.selected .pick img{ filter:brightness(0) invert(1); opacity:.92; }
.card-slot:hover .pick, .pick:focus-visible{ opacity:1; }
.pick:hover{ background:#3a2a22; }
.pick:focus-visible{ outline:2px solid #a8563f; outline-offset:2px; }
.item.selected .pick{ opacity:1; background:#7d2b28; border-color:#7d2b28; }
.item.selected .pick:hover{ background:#96352f; }
/* selected: a check in the button's corner */
.item.selected .pick::after{
  content:"✓"; position:absolute; right:-6px; bottom:-6px;
  width:16px; height:16px; border-radius:50%;
  display:grid; place-items:center;
  background:#f3ece0; color:#7d2b28;
  font:700 10px/1 var(--sans);
}
.item.selected .flip{ box-shadow:0 0 0 3px #a8563f; }
/* on the selection screen every card is selected, so marking them all
   is noise: back to hover-only, where the button offers removal */
body.selection-view .item.selected .flip{ box-shadow:none; }
body.selection-view .item.selected .pick{ opacity:0; }
body.selection-view .card-slot:hover .pick,
body.selection-view .pick:focus-visible{ opacity:1; }
/* touch screens have no hover: keep the button showing */
@media (hover: none){ .pick{ opacity:1 !important; } }
@media (prefers-reduced-motion: reduce){ .pick{ transition:none; } }

/* ---------- flip: front and back stacked, click turns the card over ---------- */
.flip{
  position:relative;
  width:var(--card-w);
  aspect-ratio:243 / 420;
  perspective:calc(var(--card-w) * 4);
  cursor:pointer;
  border-radius:calc(var(--card-w) / 24 * .95);
}
.flip:focus-visible{ outline:2px solid #a8563f; outline-offset:3px; }
.flip-inner{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transition:transform .45s ease;
}
.item.flipped .flip-inner{ transform:rotateY(180deg); }
.flip .card{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.flip .card--back{ transform:rotateY(180deg); }
@media (prefers-reduced-motion: reduce){
  .flip-inner{ transition:none; }
}

/* ---------- the card shell ---------- */
.card{
  position:relative;
  width: var(--card-w);
  aspect-ratio: 243 / 420;
  font-size: calc(var(--card-w) / 24);   /* the master scale */

  /* Geometry of the floating panel. Derived from --card-w, NOT em:
     auto-fit rescales the panel's font-size, so an em-based margin
     would move every time the text was shrunk to fit. */
  --inset:   calc(var(--card-w) * 0.022);   /* the art margin, all four sides */
  --inner-r: calc(var(--card-w) * 0.024);
  --hair:    max(1px, calc(var(--card-w) * 0.0035));
  --pad:     calc(var(--card-w) * 0.026);   /* one padding, all four edges, both sides */
  border-radius: .95em;
  overflow:hidden;
  color: var(--ink);
  background-color:var(--color-gray-800);
  background-image: var(--art);          /* own art, then _default.png beneath */
  background-size: cover, cover;
  background-position: var(--art-pos, 50% 35%), 50% 35%;
  box-shadow:
    inset 0 0 0 .09em rgba(255,255,255,.30),
    0 6px 22px rgba(0,0,0,.55);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
/* print bleed: copies of the card's art, mirrored outward past each edge.
   Same background as .card, so the art runs on unbroken across the cut. */
.bleed-tile{
  position:absolute;
  background-color:var(--color-gray-800);
  background-image: var(--art);
  background-size: cover, cover;
  background-position: var(--art-pos, 50% 35%), 50% 35%;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
/* "flat" mode: drop the art, print-friendly and easier to read */
body.flat .card,
body.flat .bleed-tile{
  background-image:none;
  background-color:color-mix(in srgb, var(--color-contrast-brown) 35%, var(--color-paper-yellow));
}


/* ---------- the floating panel (both sides) ---------- */
.panel{
  position:absolute;
  left: var(--inset); right: var(--inset);
  background: var(--parchment);
  color: var(--ink);
  border: var(--hair) solid var(--edge);
  border-radius: var(--inner-r);
  box-shadow:
    0 calc(var(--card-w) * .008) calc(var(--card-w) * .022) rgba(0,0,0,.55);
  padding: var(--pad);
  overflow:hidden;
}

/* ---------- FRONT ---------- */
/* content-sized, sitting on the bottom margin, capped so the art stays dominant */
.card--front .panel{
  bottom: var(--inset);
  max-height: 64%;
}

.cname{
  font-family:var(--card-font);
  font-size:calc(var(--fs-h1) * 1em); font-weight:var(--fw-h1); line-height:1.15;
  text-transform:uppercase; color:var(--font-header-color);
  border-bottom:1px solid var(--edge);
  padding-bottom:.12em; margin:0 0 .3em;
}
.ctype{
  font-family:var(--card-font);
  font-size:calc(var(--fs-p) * 1em); font-weight:var(--fw-p); line-height:1.3;
  color:var(--font-secondary);
  margin:0 0 .45em;
}
.ctype:last-child{ margin-bottom:0; }
/* item cards: the short piece of world lore under the type line, centered */
.cdesc{
  font-family:var(--card-font);
  font-size:calc(var(--fs-p) * 1em); font-weight:var(--fw-p); line-height:1.45;
  color:var(--font-body-color);
  text-align:center;
  margin:0 0 .42em;
}
.cdesc:last-child{ margin-bottom:0; }
.cdesc i{ font-style:italic; }
/* a check to read the back: right-aligned on the type line */
.ctype.has-check{ display:flex; justify-content:space-between; align-items:baseline; gap:.6em; }
.ccheck{ white-space:nowrap; }
.hr{ height:1px; background:var(--rule); margin:.25em 0 .4em; border:0; }

/* two-column key stats: AC|Initiative, HP|CR, Speed|— */
.keys{
  display:grid; grid-template-columns:1fr 1fr;
  column-gap:.6em; row-gap:.12em;
  font-family:var(--card-font);
  font-size:calc(var(--fs-p) * 1em); font-weight:var(--fw-p); line-height:1.4;
}
.keys b{ color:var(--font-body-color); font-size:calc(var(--fs-pb) / var(--fs-p) * 1em); font-weight:var(--fw-pb); }
.keys span{ color:var(--font-body-color); }

/* ---------- ability grid ---------- */
.abils{
  display:flex; gap:.5em;
  margin:.45em 0 0;
}
.abil-half{ flex:1 1 0; min-width:0; }
/* header and row share one font-size context (the P token) so the
   em column widths line up between them; individual cells then scale
   up or down from there by the RATIO of their own token to that
   shared P context — never by an invented number. */
.abil-hd,
.abil-row{
  display:grid;
  grid-template-columns: 2.7em 1fr 2.3em 2.3em;
  column-gap:.35em;
  font-family:var(--card-font);
  font-size:calc(var(--fs-p) * 1em);
}
.abil-hd{ line-height:1.2; margin-bottom:.05em; }
.abil-hd i{
  font-style:normal; font-weight:var(--fw-h2); color:var(--muted);
  text-transform:uppercase; letter-spacing:.02em;
  text-align:center;
}
.abil-row{ align-items:center; line-height:1.7; font-weight:var(--fw-p); }
.abil-row.tint{ background:var(--parchment-2); }
.abil-row .ab{
  color:var(--accent); letter-spacing:.02em;
  font-size:calc(var(--fs-h3) / var(--fs-p) * 1em); font-weight:var(--fw-h3);
}
.abil-row .sc,
.abil-row .md,
.abil-row .sv{ text-align:center; }
.abil-row.tint .md,
.abil-row.tint .sv{ background:var(--parchment-3); }

/* ---------- BACK ---------- */
/* fills the inset box exactly, so the art margin is even all the way round */
.card--back .panel{
  top: var(--inset);
  height: calc(100% - 2 * var(--inset));
}

.sec{ margin-bottom:.5em; }
.sec:last-child{ margin-bottom:0; }
.sec-head{
  font-family:var(--card-font);
  font-size:calc(var(--fs-h2) * 1em); font-weight:var(--fw-h2); text-transform:uppercase;
  letter-spacing:.06em; color:var(--font-header-color);
  border-bottom:1px solid var(--edge);
  padding-bottom:.12em; margin:0 0 .3em;
}
.kv{
  font-family:var(--card-font);
  font-size:calc(var(--fs-p) * 1em); font-weight:var(--fw-p); line-height:1.4; margin:0;
}
.kv b{ font-size:calc(var(--fs-pb) / var(--fs-p) * 1em); font-weight:var(--fw-pb); }

.entry{
  font-family:var(--card-font);
  font-size:calc(var(--fs-p) * 1em); font-weight:var(--fw-p); line-height:1.45;
  margin:0 0 .42em;
}
.entry:last-child{ margin-bottom:0; }
.entry .en{ font-size:calc(var(--fs-pb) / var(--fs-p) * 1em); font-weight:var(--fw-pb); }
.entry i{ font-style:italic; }

/* ---------- print: one card side per page ----------
   Built by buildPrintPages() just before the print dialog opens, then
   emptied again. On screen they sit hidden off to the side, at real
   print size, only so auto-fit can measure the cards there. */
#print-pages{ position:absolute; left:-10000px; top:0; visibility:hidden; }
.ppage{ position:relative; overflow:hidden; background:#fff; }   /* size: pageLayout() in the script */
.pslot{ position:absolute; }
.ppage .card{
  --card-w: var(--card-print-w);
  box-shadow: inset 0 0 0 .09em rgba(0,0,0,.35);
}
.ppage .marks{ position:absolute; inset:0; width:100%; height:100%; }
/* with bleed the cut makes the card's edge: square corners (round them
   with a corner punch), and no outline that a slightly-off cut would halve.
   The card sits above its bleed, which tucks just under its edge. */
.ppage .bleed{ position:absolute; overflow:hidden; z-index:0; }
.ppage.with-bleed .card{ z-index:1; border-radius:0; box-shadow:none; }

@media print{
  /* @page is in #page-rule below, written by the script */
  html,body{ background:#fff !important; color:#000; }
  body{ padding:0; margin:0; min-height:0; }
  .bar, .empty, .sheet{ display:none !important; }
  #print-pages{ position:static; visibility:visible; }
  .ppage{ break-after:page; }
  .ppage:last-child{ break-after:auto; }
}
</style>
<!-- the print page size: the card plus its bleed and crop marks, so it
     follows those two settings. Written by setPageRule() in the script. -->
<style id="page-rule"></style>
</head>
<body>

<!-- paints an icon's shape in one flat color: the .pick button's red -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="icon-red" color-interpolation-filters="sRGB">
    <feFlood flood-color="#a8563f"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
</svg>

<div class="bar">
  <h1>Statblock Cards</h1>
  <button id="back" class="quiet selection-only">← Back to cards</button>
  <label>Size <input id="size" type="range" min="200" max="620" step="10" value="300"></label>
  <label><input id="flat" type="checkbox"> Flat (no art)</label>
  <label><input id="marks" type="checkbox" checked> Crop marks</label>
  <label><input id="bleed" type="checkbox" checked> Bleed</label>
  <label>Sort
    <select id="sort">
      <option value="file">File order</option>
      <option value="cr">CR</option>
      <option value="name">Name</option>
    </select>
  </label>
  <input id="find" class="cards-only" type="search" placeholder="filter by name…" aria-label="Filter by name">

             that order, even while empty; any other group name gets
             its own section after them. No group → no header.
   art       path to an image. Falls back to art/_default.png
             automatically if the file is missing.
   artPos    focal point of that image, CSS background-position.
             "50% 20%" pushes the crop toward the top.

             several paragraphs. Supports **bold** and *italic*.

   abilities [score, mod, save] per stat.

   sections  each { title, entries: [ {name, text} | "plain line" ] }

/* ---------- Factions: the sigil, a short lore text and a check on the
   front; the faction's lore on the back, for a player who passes the
   check. ---------- */

{
  name: "The Oak Hammer Company",
  category: "other", group: "Factions",
  tag: "Faction · Mercenaries",
  subtitle: "Faction Sigil",
  check: { skill:"History", dc:16 },
  art: "art/oak_hammer_company.png",
  description: [
    "Sigil of the Oak Hammer Company, sellswords for hire.",
    "Halvardsport kept a chartered company against the raids. The city fell. A company has no walls to fall with.",
    "The hammer has come back across the water."
  ],
  sections: [
    { title:"Reputation", entries:[
      "You'll have heard of them, if you've spent any time near the sea. Not famous, mind. Just known.",
      "Folk expect cutthroats. What they get is a contract and a fair price. As long as the coin's good, the hammer's yours.",
      "They'll swear blind there's work they won't touch. Funny, then, how blood turns up wherever that hammer flies.",
      "Well-mannered lot, mostly. Depends which one you end up drinking with."
    ]},
    { title:"Organisation", entries:[
      "Don't go looking for their hall; they haven't got one. They live on their ships, and the ships go where the work is.",
      "You'll never see all of them. One ship takes a job here, another there, and nobody knows how many there are.",
      "Sellswords, scouts that see you first, and mages: young, sharp, and bored stiff by books."
    ]}
  ]
}

];
</script>

<script>
/* ============================================================
   RENDERER — no build step, no dependencies.
   ============================================================ */

const FALLBACK_ART = "art/_default.png";
const PRINT_ICON   = "Icons/Print-icon.svg";

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* **bold** and *italic*, applied after escaping */
const md = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/\*(.+?)\*/g, "<i>$1</i>");

const ABILITY_ROWS = [["STR","DEX"], ["INT","WIS"], ["CON","CHA"]];
function abilityHalf(c, which){
  const hd = `<div class="abil-hd"><i></i><i></i><i>Mod</i><i>Save</i></div>`;
  const rows = ABILITY_ROWS.map(([l, r], i) => {
    const key = which === 0 ? l : r;
    const v = (c.abilities || {})[key] || ["—","—","—"];
    return `<div class="abil-row${i % 2 === 0 ? " tint" : ""}">`
         +   `<span class="ab">${esc(key)}</span>`
         +   `<span class="sc">${esc(v[0])}</span>`
         +   `<span class="md">${esc(v[1])}</span>`
         +   `<span class="sv">${esc(v[2])}</span>`
         + `</div>`;
  }).join("");
  return `<div class="abil-half">${hd}${rows}</div>`;
}

function frontCard(c){
  const keys = [
    ["AC", c.ac],            ["Initiative", c.initiative],
    ["HP", c.hp],            ["CR", c.cr],
    ["Speed", c.speed],      [null, null]
  ];
  const keyHtml = keys.map(([k, v]) =>
    k && v ? `<div><b>${esc(k)}:</b> <span>${esc(v)}</span></div>` : `<div></div>`
  ).join("");

  const hasKeys = keys.some(([k, v]) => k && v);

  const abils = c.abilities
    ? `<div class="abils">${abilityHalf(c, 0)}${abilityHalf(c, 1)}</div>` : "";

  const desc = [].concat(c.description || []).filter(Boolean)
    .map(p => `<p class="cdesc">${md(p)}</p>`).join("");

  return `<div class="card card--front" style="${artStyle(c)}">
    <div class="panel" data-fit>
      <h2 class="cname">${esc(c.name)}</h2>
      ${c.subtitle || c.check ? `<p class="ctype${c.check ? " has-check" : ""}">`
        + `<span>${esc(c.subtitle || "")}</span>`
        + (c.check ? `<span class="ccheck">${esc(c.check.skill)} DC ${esc(c.check.dc)}</span>` : "")
        + `</p>` : ""}
      ${hasKeys ? `<div class="keys">${keyHtml}</div>` : ""}
      ${abils}
      ${desc}
    </div>
  </div>`;
}

/* Spellcasting has one fixed layout, so the heading is built here rather
   than typed per card:
     **Spellcasting (Spell save (wisdom) DC 17)**
     the spells, on a new line
   No `dc` → "Spellcasting (wisdom)". */
function spellcastingEntry(s){
  const ability = String(s.ability || "").toLowerCase();
  const inner = s.dc != null ? `Spell save (${ability}) DC ${s.dc}` : ability;
  return `<p class="entry"><span class="en">Spellcasting${inner ? ` (${esc(inner)})` : ""}</span>`
       + `<br>${md(s.spells || "")}</p>`;
}

function backCard(c){
  const out = [];

  const head = [
    ["Skills", c.skills],
    ["Vulnerabilities", c.vulnerabilities], ["Resistances", c.resistances],
    ["Immunities", c.immunities], ["Gear", c.gear],
    ["Senses", c.senses], ["Languages", c.languages]
  ].filter(([, v]) => v)
   .map(([k, v]) => `<p class="kv"><b>${esc(k)}</b> ${esc(v)}</p>`).join("");

  if (head) out.push(`<div class="sec">
      <h3 class="sec-head">Skills &amp; Gear</h3>${head}</div>`);

  for (const sec of (c.sections || [])){
    const entries = (sec.entries || []).map(e =>
      typeof e === "string"
        ? `<p class="entry">${md(e)}</p>`
        : e.spellcasting
        ? spellcastingEntry(e.spellcasting)
        : `<p class="entry"><span class="en">${esc(e.name)}.</span> ${md(e.text || "")}</p>`
    ).join("");
    out.push(`<div class="sec">
        <h3 class="sec-head">${esc(sec.title)}</h3>${entries}</div>`);
  }

  return `<div class="card card--back" style="${artStyle(c)}">
    <div class="panel" data-fit>${out.join("")}</div>
  </div>`;
}

/* own art layered over the shared fallback: if the first 404s the
   second still paints, so a character with no art yet still works */
function artStyle(c){
  const own = c.art ? `url('${encodeURI(c.art)}'), ` : "";
  const pos = c.artPos ? `--art-pos:${c.artPos};` : "";
  return `--art:${own}url('${FALLBACK_ART}');${pos}`;
}

/* ------------------------------------------------------------
   TABS, GROUPS, SORT, FILTER
   Tabs are for browsing only: the filter counts matches in every
   tab. What gets printed is the print selection (below), which can
   hold cards from every tab.

   `groups` lists each tab's sections in display order. A listed
   group shows even with no cards in it yet. A card naming a group
   that isn't listed still gets a section, after the listed ones.
   ------------------------------------------------------------ */
const TABS = [
  { id:"characters", label:"Characters", groups:[
      "Abbey of the Lost Sisters"
  ]},
  { id:"enemies",    label:"Enemies",    groups:[
      "Goblins", "Mercenaries",
      "Assassins", "Awakened Plants", "Bugbears", "Druids", "Dryads",
      "Gladiators", "Hobgoblins", "Horses", "Mages", "Mastiffs", "Ogres", "Pixies", "Priests",
      "Red Dragons", "Scouts", "Shadows", "Skeletons", "Treants",
      "Warriors", "Worgs"
  ]},
  { id:"items",      label:"Items",      groups:[
      "Magic Items", "Potions", "Poisons", "Adventuring Gear", "Weapons", "Armor"
  ]},
  { id:"other",      label:"Other",      groups:[ "Factions" ] }
];
const tabOf  = c  => TABS.some(t => t.id === c.category) ? c.category : "other";
const tabIdx = id => TABS.findIndex(t => t.id === id);

/* "1/4 (PB +2)" → 0.25; no CR sorts last */
function crValue(c){
  const m = String(c.cr || "").match(/^\s*(\d+)(?:\s*\/\s*(\d+))?/);
  return m ? m[1] / (m[2] || 1) : Infinity;
}

const SORTS = {
  file: (a, b) => a.i - b.i,
  cr:   (a, b) => crValue(a.c) - crValue(b.c) || a.i - b.i,
  name: (a, b) => a.c.name.localeCompare(b.c.name)
};

/* mode: "cards" browses by tab; "selection" shows every selected card on one page */
const view = { tab:"characters", sort:"file", q:"", mode:"cards" };

/* ------------------------------------------------------------
   PRINT SELECTION
   Cards selected for printing, by name, with how many copies of
   each, so the selection survives edits to the CHARACTERS list.
   Kept between sessions; names that no longer exist are dropped on
   load. Printing — the Print selection button or the browser's own
   print — prints only these, each as many times as its copies.
   ------------------------------------------------------------ */
const SELECTION = "lostsisters.selection";
const MAX_COPIES = 99;
const selection = new Map();   // name → copies

const clampCopies = k => Math.min(MAX_COPIES, Math.max(1, Math.round(+k) || 1));

function saveSelection(){
  try{ localStorage.setItem(SELECTION, JSON.stringify(Object.fromEntries(selection))); }catch(e){}
}

/* older saves are a plain list of names: one copy each */
function loadSelection(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SELECTION) || "null"); }catch(e){}
  const entries = Array.isArray(saved) ? saved.map(n => [n, 1])
                : saved && typeof saved === "object" ? Object.entries(saved) : [];
  const known = new Set(CHARACTERS.map(c => c.name));
  entries.forEach(([n, k]) => known.has(n) && selection.set(n, clampCopies(k)));
}

function toggleSelection(item){
  const name = CHARACTERS[+item.dataset.i].name;
  if (!selection.delete(name)) selection.set(name, 1);
  saveSelection();
  // the selection screen drops a removed card, which needs a full pass
  if (view.mode === "selection") applyView(); else paintSelection();
}

/* the − n + stepper on the selection screen. It stops at 1:
   taking a card out is the print button's job. */
function setCopies(item, k){
  const name = CHARACTERS[+item.dataset.i].name;
  if (!selection.has(name)) return;
  selection.set(name, clampCopies(k));
  saveSelection();
  paintSelection();
}

/* "3 selected", or "3 selected, 7 to print" once a card has copies */
function selectionText(){
  const n = selection.size, total = printCount();
  return total === n ? `${n} selected` : `${n} selected, ${total} to print`;
}
const printCount = () => [...selection.values()].reduce((a, k) => a + k, 0);

/* each card's button, mark and copies, and the count on the Print button */
function paintSelection(){
  document.querySelectorAll("#sheet .item").forEach(el => {
    const c  = CHARACTERS[+el.dataset.i];
    const on = selection.has(c.name);
    const b  = el.querySelector(".pick");
    el.classList.toggle("selected", on);
    b.setAttribute("aria-pressed", on);
    b.title = on ? "Remove from print selection" : "Select for print";
    b.setAttribute("aria-label", `${b.title}: ${c.name}`);
    const k = selection.get(c.name) || 1;
    el.querySelector(".copies input").value = k;
    el.querySelector(".copies .less").disabled = k <= 1;
    el.querySelector(".copies .more").disabled = k >= MAX_COPIES;
  });
  const n = selection.size;
  $("selection-n").textContent = printCount();
  $("selection-n").hidden = n === 0;
  $("print").title = selectionText();
  $("print-go").disabled = n === 0;
  $("clear").disabled = n === 0;
  if (view.mode === "selection") $("count").textContent = selectionText();
}

/* every { tab, group } section, in page order: each tab's listed
   groups first, then any others its cards name, then the ungrouped */
function buildSections(){
  const out = [];
  const add = (tab, group) => {
    if (!out.some(s => s.tab === tab && s.group === group)) out.push({ tab, group });
  };
  TABS.forEach(t => t.groups.forEach(g => add(t.id, g)));
  CHARACTERS.filter(c =>  c.group).forEach(c => add(tabOf(c), c.group));
  CHARACTERS.filter(c => !c.group).forEach(c => add(tabOf(c), ""));
  return out.sort((a, b) => tabIdx(a.tab) - tabIdx(b.tab));   // stable: keeps the order above
}
let SECTIONS = [];

function itemHtml(c, i){
  return `
    <article class="item" data-i="${i}" data-name="${esc(c.name.toLowerCase())}">
      <div class="item-head">
        <div class="item-label">${esc(c.name)}
          ${c.tag ? `<span>— ${esc(c.tag)}</span>` : ""}</div>
        <div class="copies" role="group" title="Copies to print" aria-label="Copies of ${esc(c.name)}">
          <button class="less" type="button" aria-label="One copy fewer">−</button>
          <input type="number" min="1" max="${MAX_COPIES}" value="1" aria-label="Copies">
          <button class="more" type="button" aria-label="One copy more">+</button>
        </div>
      </div>
      <div class="card-slot">
        <div class="flip" role="button" tabindex="0" aria-pressed="false"
             title="Click to flip" aria-label="${esc(c.name)} — flip card">
          <div class="flip-inner">${frontCard(c)}${backCard(c)}</div>
        </div>
        <button class="pick" type="button" aria-pressed="false"><img src="${PRINT_ICON}" alt=""></button>
      </div>
    </article>`;
}

function render(){
  SECTIONS = buildSections();
  document.getElementById("sheet").innerHTML = SECTIONS.map((s, k) => `
    <section class="group" data-s="${k}">
      ${s.group ? `<h2 class="group-head">${esc(s.group)}<span class="n"></span></h2>` : ""}
      <p class="group-empty">No cards yet.</p>
      <div class="group-cards">${
        CHARACTERS.map((c, i) => tabOf(c) === s.tab && (c.group || "") === s.group ? itemHtml(c, i) : "")
                  .join("")
      }</div>
    </section>`).join("");

  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button role="tab" data-tab="${t.id}">${esc(t.label)}<span class="n"></span></button>`
  ).join("");

  applyView();
}

/* order, tab and filter applied to the cards already in the page —
   moving rather than re-rendering keeps each card's flipped state.
   The selection screen ignores tab and filter: it shows every selected
   card, in its group, with groups holding none left out. */
function applyView(){
  const inSelectionView = view.mode === "selection";
  document.body.classList.toggle("selection-view", inSelectionView);
  const counts = Object.fromEntries(TABS.map(t => [t.id, 0]));
  let matches = 0, shownHere = 0;

  document.querySelectorAll("#sheet .group").forEach(sec => {
    const s = SECTIONS[+sec.dataset.s];
    const box = sec.querySelector(".group-cards");
    const items = [...box.children].map(el => {
      const i = +el.dataset.i;
      return { el, i, c: CHARACTERS[i] };
    });
    items.sort(SORTS[view.sort]).forEach(x => box.appendChild(x.el));

    let n = 0;
    for (const { el, c } of items){
      const hit = inSelectionView ? selection.has(c.name)
                               : !view.q || el.dataset.name.includes(view.q);
      el.hidden = !hit;
      if (hit) n++;
    }
    counts[s.tab] += n;
    matches += n;

    const head = sec.querySelector(".group-head .n");
    if (head) head.textContent = n;
    sec.classList.toggle("none", n === 0);
    sec.classList.toggle("offtab", !inSelectionView && s.tab !== view.tab);
    /* while filtering, a group with no matches drops out entirely;
       otherwise an empty listed group stays, saying "No cards yet" */
    sec.hidden = n === 0 && (inSelectionView || !!view.q || !s.group);
    if ((inSelectionView || s.tab === view.tab) && !sec.hidden) shownHere++;
  });

  document.querySelectorAll("#tabs button").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.tab === view.tab);
    b.querySelector(".n").textContent = counts[b.dataset.tab];
  });

  const label = TABS[tabIdx(view.tab)].label.toLowerCase();
  const empty = $("empty");
  empty.hidden = shownHere > 0;
  empty.textContent = inSelectionView
    ? "No cards selected yet. Hover a card and press its print button to select it."
    : view.q
    ? `No ${label} match “${view.q}”.`
    : `No ${label} yet.`;

  const n = CHARACTERS.length;
  if (!inSelectionView) $("count").textContent = view.q   // the selection's own: paintSelection()
    ? `${matches} of ${n} match`
    : n + (n === 1 ? " card" : " cards");

  paintSelection();
  fitAll();
}

/* ------------------------------------------------------------
   AUTO-FIT
   Statblocks vary wildly in length. Shrink a panel's type until
   its content fits the card rather than letting it clip.
   ------------------------------------------------------------ */
/* Both panels now have a definite box — the back fills the inset area,
   the front is content-sized under a max-height — so overflow is simply
   scrollHeight beating clientHeight, and one routine handles both. */
function fit(panel){
  panel.style.fontSize = "";
  if (panel.scrollHeight <= panel.clientHeight + 1) return;
  let lo = 0.5, hi = 1;
  for (let i = 0; i < 14; i++){
    const mid = (lo + hi) / 2;
    panel.style.fontSize = (mid * 100) + "%";
    if (panel.scrollHeight <= panel.clientHeight + 1) lo = mid; else hi = mid;
  }
  panel.style.fontSize = (lo * 100) + "%";
}

function fitAll(){
  document.querySelectorAll(".panel[data-fit]").forEach(fit);
}

/* ---------- controls ---------- */
const $ = id => document.getElementById(id);

$("size").addEventListener("input", e => {
  document.documentElement.style.setProperty("--card-w", e.target.value + "px");
  clearTimeout(window._fitT);
  window._fitT = setTimeout(fitAll, 60);
});

$("flat").addEventListener("change", e =>
  document.body.classList.toggle("flat", e.target.checked));

$("find").addEventListener("input", e => {
  view.q = e.target.value.trim().toLowerCase();
  applyView();
});

$("sort").addEventListener("change", e => {
  view.sort = e.target.value;
  applyView();
});

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  view.tab = b.dataset.tab;
  applyView();
  savePrefs();
});

/* click, Enter or Space turns a card over */
function flip(el){
  const item = el.closest(".item");
  const on = item.classList.toggle("flipped");
  el.setAttribute("aria-pressed", on);
}
$("sheet").addEventListener("click", e => {
  const p = e.target.closest(".pick");
  if (p) return toggleSelection(p.closest(".item"));
  const s = e.target.closest(".copies button");
  if (s){
    const item = s.closest(".item");
    const k = selection.get(CHARACTERS[+item.dataset.i].name);
    return setCopies(item, k + (s.classList.contains("more") ? 1 : -1));
  }
  const f = e.target.closest(".flip");
  if (f) flip(f);
});
/* a number typed into the stepper: Enter or leaving the box */
$("sheet").addEventListener("change", e => {
  if (e.target.matches(".copies input")) setCopies(e.target.closest(".item"), e.target.value);
});
$("sheet").addEventListener("keydown", e => {
  const f = e.target.closest(".flip");
  if (f && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); flip(f); }
});

/* ---------- the two screens: cards, and the print selection (#selection) ----------
   The selection lives at #selection, so the browser's back button and a
   reload both behave like moving between two pages. */
let cardsScroll = 0, pushedSelection = false;

function syncMode(){
  const mode = location.hash === "#selection" ? "selection" : "cards";
  if (mode === view.mode) return;
  if (mode === "selection") cardsScroll = window.scrollY;
  view.mode = mode;
  applyView();
  window.scrollTo(0, mode === "selection" ? 0 : cardsScroll);
}
window.addEventListener("hashchange", syncMode);

$("print").addEventListener("click", () => {
  pushedSelection = true;
  location.hash = "selection";
});

$("back").addEventListener("click", () => {
  if (pushedSelection){ pushedSelection = false; history.back(); return; }
  // opened straight on #selection: nothing to go back to, so swap in place
  try{ history.replaceState(null, "", location.pathname + location.search); }
  catch(e){ location.hash = ""; }
  syncMode();
});

$("clear").addEventListener("click", () => {
  const n = selection.size;
  if (!n || !confirm(`Remove all ${n} card${n === 1 ? "" : "s"} from the print selection?`)) return;
  selection.clear();
  saveSelection();
  applyView();
});

$("print-go").addEventListener("click", () => window.print());

window.addEventListener("resize", () => {
  clearTimeout(window._fitR);
  window._fitR = setTimeout(fitAll, 120);
});
/* ------------------------------------------------------------
   PRINT PAGES
   Only the selection prints, from either screen, in the order the
   selection screen shows it: each card's front on one page and its
   back on the next, repeated for each copy, so the PDF holds every
   physical card. A page is the card plus room for its bleed and
   crop marks, nothing more, which is how print shops want it; they
   print front and back on one sheet and cut along the marks.
   Bleed: the art runs on past every cut, so a cut a little off still
   lands on art, not white paper. Crop marks sit in the margin only,
   never on the card, start beyond the bleed and run to the page edge.
   ------------------------------------------------------------ */
const PAGE = { bleed:3, markOffset:3, markLen:5 };   // mm

/* the card's size, the margin around it and the page that makes, in mm */
function pageLayout(){
  const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--card-print-w"));
  const ch = cw * 420 / 243;
  const bleed = $("bleed").checked, marks = $("marks").checked;
  const o = bleed ? Math.max(PAGE.markOffset, PAGE.bleed + 1) : PAGE.markOffset;   // 1 mm clear of the art
  const m = marks ? o + PAGE.markLen : bleed ? PAGE.bleed : 0;
  return { cw, ch, bleed, marks, o, m, w:cw + 2 * m, h:ch + 2 * m };
}

/* @page can't be set from a variable, so its size is written out here,
   on load and whenever Bleed or Crop marks change */
function setPageRule(){
  const { w, h } = pageLayout();
  $("page-rule").textContent = `@page{ size:${w}mm ${h}mm; margin:0; }`;
}

function buildPrintPages(){
  const cards = [...document.querySelectorAll("#sheet .item")]
    .map(el => CHARACTERS[+el.dataset.i])
    .filter(c => selection.has(c.name));
  const L = pageLayout();
  const page = (c, side) => `
    <div class="ppage${L.bleed ? " with-bleed" : ""}" style="width:${L.w}mm;height:${L.h}mm">
      <div class="pslot" style="left:${L.m}mm;top:${L.m}mm">${
        L.bleed ? bleedHtml(c, L.cw, L.ch) : ""}${side(c)}</div>
      ${L.marks ? cropMarks(L) : ""}
    </div>`;
  $("print-pages").innerHTML = cards
    .map(c => (page(c, frontCard) + page(c, backCard)).repeat(selection.get(c.name)))
    .join("");
  $("print-pages").querySelectorAll(".panel[data-fit]").forEach(fit);
}

/* The art fills the card exactly, so there is nothing past its edge to
   bleed with. Instead: eight copies of the card's art around it, each
   edge copy flipped across that edge and each corner copy across both,
   so the picture mirrors outward and runs on unbroken at the cut. They
   tuck 0.2 mm under the card so no hairline seam can open at the cut. */
function bleedHtml(c, cw, ch){
  const b = PAGE.bleed, tuck = 0.2;
  const tiles = [];
  for (const dy of [-1, 0, 1]) for (const dx of [-1, 0, 1]){
    if (!dx && !dy) continue;
    tiles.push(`<div class="bleed-tile" style="left:${b + dx * (cw - tuck)}mm;top:${b + dy * (ch - tuck)}mm;` +
      `width:${cw}mm;height:${ch}mm;transform:scale(${dx ? -1 : 1},${dy ? -1 : 1})"></div>`);
  }
  return `<div class="bleed" style="${artStyle(c)}left:${-b}mm;top:${-b}mm;` +
    `width:${cw + 2 * b}mm;height:${ch + 2 * b}mm">${tiles.join("")}</div>`;
}

/* a short line beyond each cut, out to the page edge: above and below
   the card's two sides, left and right of its top and bottom */
function cropMarks({ cw, ch, o, m, w, h }){
  const len = PAGE.markLen, d = [];
  [m, m + cw].forEach(x => d.push(`M${x} ${m - o}v${-len}`, `M${x} ${m + ch + o}v${len}`));
  [m, m + ch].forEach(y => d.push(`M${m - o} ${y}h${-len}`, `M${m + cw + o} ${y}h${len}`));
  return `<svg class="marks" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d.join("")}" fill="none" stroke="#000" stroke-width=".15"/></svg>`;
}

window.addEventListener("beforeprint", buildPrintPages);
window.addEventListener("afterprint", () => { $("print-pages").innerHTML = ""; });
["bleed","marks"].forEach(id => $(id).addEventListener("change", setPageRule));

/* ---------- remember view settings between sessions ---------- */
const PREFS = "lostsisters.cards";

function savePrefs(){
  try{
    localStorage.setItem(PREFS, JSON.stringify({
      w: $("size").value, flat: $("flat").checked, marks: $("marks").checked, bleed: $("bleed").checked,
      tab: view.tab, sort: view.sort
    }));
  }catch(e){ /* file:// with site data blocked — not worth failing over */ }
}

function loadPrefs(){
  let p = null;
  try{ p = JSON.parse(localStorage.getItem(PREFS) || "null"); }catch(e){}
  const w = new URLSearchParams(location.search).get("w") || (p && p.w);
  if (w){
    $("size").value = w;
    document.documentElement.style.setProperty("--card-w", w + "px");
  }
  if (p){
    $("flat").checked   = !!p.flat;
    $("marks").checked  = p.marks !== false;   // on unless turned off
    $("bleed").checked  = p.bleed !== false;
    document.body.classList.toggle("flat", !!p.flat);
    if (TABS.some(t => t.id === p.tab)) view.tab = p.tab;
    if (SORTS[p.sort]) view.sort = $("sort").value = p.sort;
  }
}

["size","flat","marks","bleed","sort"].forEach(id => $(id).addEventListener("change", savePrefs));

loadPrefs();
setPageRule();
loadSelection();
view.mode = location.hash === "#selection" ? "selection" : "cards";
render();

if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
</script>
