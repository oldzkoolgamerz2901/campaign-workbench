@if (showingPrototype) {
  @if (prototypeType(); as prototype) {
    <ng-container [ngComponentOutlet]="prototype" />
  }
} @else {
  @if (connection().startsWith('Unavailable')) {
    <div class="availability-warning" role="alert" aria-label="Connection status">
      Backend unavailable. Your local edits are retained; save status is shown in the workspace.
      <button matButton [disabled]="checking()" (click)="checkConnection()">
        Retry connection
      </button>
    </div>
  }
  <main><router-outlet /></main>
}
