spring.application.name=campaign-workbench
server.address=127.0.0.1
spring.datasource.url=${WORKBENCH_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/campaign_workbench}
spring.datasource.username=${POSTGRES_USER:workbench}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.default-schema=workbench_setup
springdoc.api-docs.enabled=true

# A replacement has bounded JSON metadata plus one image; ordinary JSON requests retain their existing cap.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-part-count=2
